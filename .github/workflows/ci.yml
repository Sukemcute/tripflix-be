name: ci

on:
  pull_request:
  # Khi push lên develop, main hoặc tag, publish.yml gọi CI trước rồi mới build image, nên không chạy riêng để khỏi chạy hai lần.
  workflow_call:

permissions:
  contents: read

# PR: lần push mới huỷ lần chạy cũ. Nhánh develop, main không huỷ để commit nào cũng được kiểm đủ.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Test với Postgres, Redis thật (Testcontainers); runner ubuntu có sẵn Docker.
      - run: pnpm test:int
      - run: pnpm build
      - name: Hợp đồng (contracts/) đã được sinh lại và commit
        run: pnpm contracts:build && git diff --exit-code contracts/
