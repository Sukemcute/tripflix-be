name: publish

on:
  push:
    branches: [develop, main]
    tags: ["v*", "core-api-v*", "notification-v*", "video-v*"]

permissions:
  contents: read
  packages: write

jobs:
  # CI đỏ thì không build image, để server không kéo phải bản lỗi.
  check:
    uses: ./.github/workflows/ci.yml

  image:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        app: [core-api, notification-service, video-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Builder buildx cần cho cache type=gha (driver docker mặc định không ghi được cache này).
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Mỗi app một scope cache, để ba image không ghi đè cache của nhau.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
