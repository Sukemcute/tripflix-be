# Gateway trên server: chỉ đi HTTPS, chỉ nhận đúng API_HOST. Máy dev dùng dynamic.yml.
# Thêm service nào thì thêm router của service đó khi nó đã chạy.
# AI chỉ mở đúng POST /ai/chat cho trợ lý Tripi (TF31); /moderate và /health vẫn chỉ trong mạng nội bộ.
http:
  middlewares:
    # Cùng mức với dynamic.yml, xem README.md.
    rate-limit-api:
      rateLimit:
        average: 50
        period: 1s
        burst: 100
    rate-limit-auth:
      rateLimit:
        average: 30
        period: 1m
        burst: 10

    redirect-to-apex:
      redirectRegex:
        regex: ^https://www\.(.+)
        replacement: https://${1}
        permanent: true

    # https://<API_HOST>/ai/chat -> ai-service /chat
    strip-ai-prefix:
      stripPrefix:
        prefixes: ['/ai']

  routers:
    core-api-auth:
      rule: >-
        Host(`{{ env "API_HOST" }}`) && Method(`POST`) && (Path(`/api/auth/login`) || Path(`/api/auth/register`) || Path(`/api/auth/registration-code`) ||
        Path(`/api/auth/google`) || Path(`/api/auth/password/forgot`) || Path(`/api/auth/password/reset`) ||
        Path(`/api/auth/service-token`))
      priority: 100
      service: core-api
      entryPoints: [websecure]
      middlewares: [rate-limit-auth]
      tls:
        certResolver: letsencrypt
    core-api:
      rule: Host(`{{ env "API_HOST" }}`) && PathPrefix(`/api`)
      service: core-api
      entryPoints: [websecure]
      middlewares: [rate-limit-api]
      tls:
        certResolver: letsencrypt

    ai-chat:
      rule: Host(`{{ env "API_HOST" }}`) && Method(`POST`) && Path(`/ai/chat`)
      service: ai-service
      entryPoints: [websecure]
      middlewares: [rate-limit-api, strip-ai-prefix]
      tls:
        certResolver: letsencrypt

    # Hộp thông báo (TF46) và WebSocket /ws (TF26A) của notification-service.
    notification:
      rule: Host(`{{ env "API_HOST" }}`) && (PathPrefix(`/notifications`) || PathPrefix(`/ws`))
      service: notification-service
      entryPoints: [websecure]
      middlewares: [rate-limit-api]
      tls:
        certResolver: letsencrypt

    web:
      rule: Host(`{{ env "WEB_HOST" }}`)
      service: web
      entryPoints: [websecure]
      middlewares: [rate-limit-api]
      tls:
        certResolver: letsencrypt
    web-www:
      rule: Host(`www.{{ env "WEB_HOST" }}`)
      service: web
      entryPoints: [websecure]
      middlewares: [redirect-to-apex]
      tls:
        certResolver: letsencrypt
    admin:
      rule: Host(`{{ env "ADMIN_HOST" }}`)
      service: admin
      entryPoints: [websecure]
      middlewares: [rate-limit-api]
      tls:
        certResolver: letsencrypt

  services:
    core-api:
      loadBalancer:
        servers:
          - url: http://core-api:3000
    notification-service:
      loadBalancer:
        servers:
          - url: http://notification-service:3001
    ai-service:
      loadBalancer:
        servers:
          - url: http://ai-service:8000
    web:
      loadBalancer:
        servers:
          - url: http://web:3100
    admin:
      loadBalancer:
        servers:
          - url: http://admin:3200
