services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes: ['./observability/collector.yaml:/etc/otelcol/config.yaml:ro']
    ports: ['127.0.0.1:4318:4318']
    depends_on: [tempo]
    restart: unless-stopped
    mem_limit: 256m
  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      [
        '--config.file=/etc/prometheus/prometheus.yml',
        '--storage.tsdb.retention.time=7d',
        '--storage.tsdb.retention.size=2GB',
      ]
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:9095:9090']
    restart: unless-stopped
    mem_limit: 512m
  tempo:
    image: grafana/tempo:2.9.0
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ['127.0.0.1:3205:3200']
    restart: unless-stopped
    mem_limit: 512m
volumes:
  prometheus-data:
  tempo-data:
