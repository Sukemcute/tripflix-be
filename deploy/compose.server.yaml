# Chạy Tripflix trên một máy server. Khác compose.yaml (máy dev): dùng image production trên GHCR,
# mật khẩu riêng trong .env.server, Postgres và Redis không mở cổng, API chỉ nghe trên 127.0.0.1.
# Cách dùng: xem deploy/SERVER.md.
name: tripflix-server

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '3' }

x-core-env: &core-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  REDIS_URL: redis://redis:6379
  DATABASE_URL_ACCESS: postgres://tf_access:${DB_PASS_ACCESS:?}@postgres:5432/core
  DATABASE_URL_CONTENT: postgres://tf_content:${DB_PASS_CONTENT:?}@postgres:5432/core
  DATABASE_URL_DISCOVERY: postgres://tf_discovery:${DB_PASS_DISCOVERY:?}@postgres:5432/core
  DATABASE_URL_ANALYTICS: postgres://tf_analytics:${DB_PASS_ANALYTICS:?}@postgres:5432/core
  DATABASE_URL_COMMERCE: postgres://tf_commerce:${DB_PASS_COMMERCE:?}@postgres:5432/core
  AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:?}
  AUTH_JWT_ISSUER: tripflix-core
  AUTH_JWT_AUDIENCE: tripflix
  AUTH_WEB_ORIGINS: ${AUTH_WEB_ORIGINS:-http://localhost:3100}
  AUTH_PASSWORD_RESET_URL: ${AUTH_PASSWORD_RESET_URL:-http://localhost:3100/dat-lai-mat-khau}
  AUTH_EMAIL_VERIFY_URL: ${AUTH_EMAIL_VERIFY_URL:-http://localhost:3100/xac-thuc-email}
  AUTH_REGISTER_MAX_PER_IP_HOUR: ${AUTH_REGISTER_MAX_PER_IP_HOUR:-5}
  # OAuth Client ID của Google (cách nhau bởi dấu phẩy). Trống: tắt đăng nhập Google, POST /api/auth/google trả 503.
  GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
  AWS_REGION: ${AWS_REGION:-ap-southeast-2}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET:-tripflix-media-dev}
  S3_KEY_PREFIX: ${S3_KEY_PREFIX:?}
  MEDIA_CDN_URL: ${MEDIA_CDN_URL:?}
  VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
  VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
  VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  # Không để trống: core-api kiểm biến này là URL, chuỗi rỗng làm app không khởi động được.
  VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-https://tripflix.io.vn/payments/vnpay/return}

services:
  # ---------- Giai đoạn 1: database, Redis ----------
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      DB_PASS_ACCESS: ${DB_PASS_ACCESS:?}
      DB_PASS_CONTENT: ${DB_PASS_CONTENT:?}
      DB_PASS_DISCOVERY: ${DB_PASS_DISCOVERY:?}
      DB_PASS_ANALYTICS: ${DB_PASS_ANALYTICS:?}
      DB_PASS_COMMERCE: ${DB_PASS_COMMERCE:?}
      DB_PASS_NOTIFICATION: ${DB_PASS_NOTIFICATION:?}
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Chạy theo tên file, một lần khi volume còn trống. File 90 thay mật khẩu dev của file 02.
      - ./postgres/init/01-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
      - ./postgres/init/02-roles-schemas.sql:/docker-entrypoint-initdb.d/02-roles-schemas.sql:ro
      - ./postgres/init/03-extensions.sql:/docker-entrypoint-initdb.d/03-extensions.sql:ro
      - ./postgres/server/90-passwords.sh:/docker-entrypoint-initdb.d/90-passwords.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d core']
      interval: 5s
      retries: 20

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    logging: *logging
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  # ---------- Giai đoạn 2: core-api ----------
  migrate:
    profiles: [api]
    image: ${IMAGE_PREFIX:-ghcr.io/sukemcute/tripflix-be}/core-api:${CORE_API_TAG:-${IMAGE_TAG:-develop}}
    logging: *logging
    command: ['node', 'dist/cli/migrate.js']
    environment: *core-env
    depends_on:
      postgres: { condition: service_healthy }

  core-api:
    profiles: [api]
    image: ${IMAGE_PREFIX:-ghcr.io/sukemcute/tripflix-be}/core-api:${CORE_API_TAG:-${IMAGE_TAG:-develop}}
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *core-env
      APP_ROLE: all
      PORT: 3000
    ports: ['127.0.0.1:${API_PORT:-3000}:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ---------- Giai đoạn 4: gửi email (TF05D) ----------
  # Gửi email xác thực, đặt lại mật khẩu, chào mừng qua SMTP của Amazon SES (deploy/SERVER.md, Giai đoạn 4).
  # Profile riêng, bật khi đã có SMTP_URL; thiếu thì service dừng lúc khởi động với lỗi rõ ràng, profile khác chạy như cũ.
  notification-service:
    profiles: [mail]
    image: ${IMAGE_PREFIX:-ghcr.io/sukemcute/tripflix-be}/notification-service:${NOTIFICATION_TAG:-${IMAGE_TAG:-develop}}
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3001
      REDIS_URL: redis://redis:6379
      DATABASE_URL_NOTIFICATION: postgres://tf_notification:${DB_PASS_NOTIFICATION:?}@postgres:5432/notification
      JWKS_URL: http://core-api:3000/.well-known/jwks.json
      AUTH_JWT_ISSUER: tripflix-core
      AUTH_JWT_AUDIENCE: tripflix
      # smtps://<SMTP user>:<SMTP password>@email-smtp.<region>.amazonaws.com:465 (mật khẩu đã URL-encode).
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Tripflix <no-reply@tripflix.io.vn>}
      WEB_APP_URL: ${WEB_APP_URL:-https://tripflix.io.vn}
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------- Giai đoạn 5: AI (repo tripflix-ai) ----------
  # ai-service và worker dùng chung image và AI_TAG. App đọc tóm tắt, kết quả kiểm duyệt qua core-api.
  # ai-service (TF32): POST /moderate cho core-api gọi kiểm duyệt chữ và ảnh qua OpenAI moderation.
  # Chỉ nghe trong mạng nội bộ (gateway không có đường /ai), chỉ nhận service token của core-api,
  # kiểm bằng JWKS của core-api. Thiếu OPENAI_API_KEY thì /moderate trả 503 và core giữ bước lọc regex.
  # Không tải bộ phân loại, không gọi LLM nên nhẹ, giới hạn nửa nhân.
  ai-service:
    profiles: [ai]
    image: ${AI_IMAGE_PREFIX:-ghcr.io/sukemcute/tripflix-ai}/ai-service:${AI_TAG:-develop}
    restart: unless-stopped
    logging: *logging
    environment:
      CORE_API_URL: http://core-api:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: INFO
    cpus: 0.5
    mem_limit: 384m
    healthcheck:
      test: ['CMD', '/app/.venv/bin/python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Worker tóm tắt (TF14): nghe bình luận trên stream:core.content, gom 60 giây mỗi bài rồi gọi DeepSeek, ghi kết quả về core-api
  # bằng service token (client ai-service, deploy/SERVER.md mục Tóm tắt AI). Lần đầu chạy đọc lại cả sự kiện cũ trong stream.
  # Bộ phân loại bình luận cần ~2 nhân và ~820 MB RAM với 2 luồng. Máy chỉ 2 vCPU dùng chung với core-api,
  # nên mặc định giới hạn 1 nhân, 1 luồng; số luồng phải bằng số nhân được cấp.
  ai-summary-worker:
    profiles: [ai]
    image: ${AI_IMAGE_PREFIX:-ghcr.io/sukemcute/tripflix-ai}/ai-service:${AI_TAG:-develop}
    restart: unless-stopped
    logging: *logging
    command: ['/app/.venv/bin/python', '-m', 'app.workers.summary_worker']
    environment:
      CORE_API_URL: http://core-api:3000
      REDIS_URL: redis://redis:6379
      # Thiếu key thì worker dừng lúc khởi động với lỗi DEEPSEEK_API_KEY is empty.
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      SERVICE_CLIENT_ID: ai-service
      SERVICE_CLIENT_SECRET: ${AI_SERVICE_CLIENT_SECRET:-}
      # true = không gọi DeepSeek (tắt khẩn cấp, ví dụ khi tốn tiền bất thường).
      SUMMARY_LLM_KILL: ${SUMMARY_LLM_KILL:-false}
      CLASSIFIER_THREADS: ${AI_WORKER_CPUS:-1}
      LOG_LEVEL: INFO
    cpus: ${AI_WORKER_CPUS:-1}
    mem_limit: 1536m
    depends_on:
      redis: { condition: service_healthy }

  # Dữ liệu mẫu, chạy tay một lần. Image production không có file seed và cli/seed chặn NODE_ENV=production,
  # nên service này build stage dev từ mã nguồn trên server.
  seed:
    profiles: [seed]
    build: { context: .., dockerfile: apps/core-api/Dockerfile, target: dev }
    logging: *logging
    command: ['sh', '-c', 'pnpm turbo run build --filter=@tripflix/core-api... && pnpm --filter @tripflix/core-api db:seed']
    environment:
      <<: *core-env
      NODE_ENV: development
      SEED_PASSWORD: ${SEED_PASSWORD:?}
    depends_on:
      postgres: { condition: service_healthy }

  # ---------- Giai đoạn 3: HTTPS ----------
  traefik:
    profiles: [gateway]
    image: traefik:v3.7
    restart: unless-stopped
    logging: *logging
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --providers.file.filename=/etc/traefik/server.yml
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --ping=true
    environment:
      API_HOST: ${API_HOST:?}
      WEB_HOST: ${WEB_HOST:?}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./traefik/server.yml:/etc/traefik/server.yml:ro
      - letsencrypt:/letsencrypt
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 5s
      retries: 6

  # Build trên server vì Next gắn địa chỉ API vào bundle lúc build, image trên GHCR không có địa chỉ này.
  web:
    profiles: [gateway]
    # Mặc định dùng image build trên máy; deploy-web.sh đặt 2 biến này trong .env.web để dùng image từ GHCR.
    image: ${WEB_IMAGE:-tripflix-server-web}:${WEB_TAG:-latest}
    build:
      context: ${FE_REPO:-../../tripflix-fe}
      dockerfile: apps/web/Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: https://${API_HOST:?}
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3100/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pg-data:
  redis-data:
  letsencrypt:
